apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: upfield
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upfield-db
  namespace: upfield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upfield-db
  template:
    metadata:
      labels:
        app: upfield-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom:
        - secretRef:
            name: upfield-secrets
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: upfield-db
  namespace: upfield
spec:
  selector:
    app: upfield-db
  ports:
    - port: 5432
      targetPort: 5432
