apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upfield-ingress
  namespace: upfield
  annotations:
    # We will use traefik (K3s default)
    kubernetes.io/ingress.class: "traefik"
    # Auto-provision SSL certificate using our ClusterIssuer
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - upfield.sasmazelektronik.com
    - api.upfield.sasmazelektronik.com
    secretName: upfield-tls-secret
  rules:
  - host: upfield.sasmazelektronik.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: upfield-frontend
            port:
              number: 80
  - host: api.upfield.sasmazelektronik.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: upfield-backend
            port:
              number: 8000
