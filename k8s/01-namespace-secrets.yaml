apiVersion: v1
kind: Namespace
metadata:
  name: upfield
---
apiVersion: v1
kind: Secret
metadata:
  name: upfield-secrets
  namespace: upfield
type: Opaque
stringData:
  # Base database url for backend connection
  DATABASE_URL: "postgresql://upfield:upfield_secure_pass@upfield-db:5432/upfield"
  POSTGRES_USER: "upfield"
  POSTGRES_PASSWORD: "upfield_secure_pass"
  POSTGRES_DB: "upfield"
