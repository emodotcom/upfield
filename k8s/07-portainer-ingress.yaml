apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: portainer
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer-ingress
  namespace: portainer
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: portainer-redirect-https@kubernetescrd
spec:
  tls:
  - hosts:
    - portainer.sasmazelektronik.com
    secretName: portainer-tls-secret
  rules:
  - host: portainer.sasmazelektronik.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer
            port:
              # 9000 is Portainer's internal HTTP port
              number: 9000
