services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Override DATABASE_URL to use PostgreSQL inside Docker
      DATABASE_URL: postgresql://upfield:upfield@db:5432/upfield
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upfield
      POSTGRES_PASSWORD: upfield
      POSTGRES_DB: upfield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upfield"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
